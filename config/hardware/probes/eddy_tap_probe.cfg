[gcode_macro _USER_VARIABLES]
variable_probe_type_enabled: "tap_probe"
variable_tap_probe_randomise_tap: 5 #(in mm)
gcode:

# TAP probe definition also include the probe management macro directly from here
[include ../../../macros/base/probing/nozzle_probe.cfg]


[stepper_z]
endstop_pin: probe:z_virtual_endstop
homing_retract_dist: 0

# special start module for z calibrating

[gcode_macro CALIBRATE_Z]
description: Perform the Z calibration using eddy nozzle contact feature
gcode:
    #folling instruction of carto survey
    # move to tap location and probe_calibrate
    {% set _uvars = printer["gcode_macro _USER_VARIABLES"] %}
    {% set _settings = printer.configfile.settings %}
    {% set _abm = printer["gcode_macro COMPUTE_MESH_PARAMETERS"].abm %}
    {% set tap_probe_randomise_tap = (_uvars.tap_probe_randomise_tap*100) | int %}

    {% if not _abm.do_mesh and _abm.ready %}
        {% set touch_location_x, touch_location_y = _abm.mesh_center %}
    {% elif _settings.scanner is defined %}
        {% set touch_location_x, touch_location_y = _settings.scanner.scanner_touch_location %}
    {% elif _settings.beacon is defined or _settings.cartographer is defined %}
        # If there is a bed_mesh enabled and a zero_reference_position set, we retrieve it to home on it
        # Else, we default to the center of the bed
        {% if not _uvars.bed_mesh_enabled or not printer["configfile"].config["bed_mesh"]["zero_reference_position"] %}
            {% set touch_location_x = printer.toolhead.axis_maximum.x|int/2 + printer.toolhead.axis_minimum.x|int/2 %}
            {% set touch_location_y = printer.toolhead.axis_maximum.y|int/2 + printer.toolhead.axis_minimum.y|int/2 %}
        {% else %}
            {% set touch_location_x, touch_location_y = _settings.bed_mesh.zero_reference_position %}
        {% endif %}
    {% endif %}
   
    # randomise a little bit tap location
    {% set random_offset_x = (range(-tap_probe_randomise_tap, tap_probe_randomise_tap) | random) | default(0) / 100 %}
    {% set random_offset_y = (range(-tap_probe_randomise_tap, tap_probe_randomise_tap) | random) | default(0) / 100 %}
    {% set final_tap_location_x = (touch_location_x + random_offset_x)|float %}
    {% set final_tap_location_y = (touch_location_y + random_offset_y)|float %}

    {% if _uvars.status_leds_enabled %}
        STATUS_LEDS COLOR="CALIBRATING_Z"
    {% endif %}

    {% if _uvars.verbose %}
        RESPOND MSG="Auto Z calibration..."
    {% endif %}
        
    {% if not 'xyz' in printer.toolhead.homed_axes %}
        { action_raise_error("Must Home printer first!") }
    {% endif %}

    {% if _uvars.verbose %}
        { action_respond_info("Probe calibrate") }
    {% endif %}

    #Calibrate probe
    _EDDY_TAP_PROBE_TOUCH X={final_tap_location_x} Y={final_tap_location_y}

    {% if _uvars.status_leds_enabled %}
        STATUS_LEDS COLOR="READY"
    {% endif %}
